name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Lint
        run: pnpm lint
      - name: Checagem de tipos
        run: pnpm typecheck
      - name: Testes (o motor quebra o build abaixo de 90% de cobertura)
        run: pnpm test && pnpm --filter @nova/engine test:coverage
      - name: Nenhuma cor fora dos tokens
        run: pnpm check:colors
      - name: Build
        run: pnpm build

  e2e:
    name: E2E (360 px e 1440 px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Com o projeto conectado à Vercel, defina a variável PLAYWRIGHT_BASE_URL com a URL do preview
      # para os testes rodarem contra ele. Sem ela, o app é construído e servido no próprio runner.
      - name: Playwright
        run: pnpm e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
