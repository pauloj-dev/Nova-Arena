name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres de verdade para os testes de integração do banco e da API (plano §4.3).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nova:nova@localhost:5432/nova_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Lint
        run: pnpm lint
      - name: Checagem de tipos
        run: pnpm typecheck
      - name: Migrations no banco de teste (um banco novo sobe só com migrations)
        run: pnpm --filter @nova/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Testes (o motor quebra o build abaixo de 90% de cobertura)
        run: pnpm test && pnpm --filter @nova/engine test:coverage
      - name: Nenhuma cor fora dos tokens
        run: pnpm check:colors
      - name: Build
        run: pnpm build

  seguranca:
    name: Segurança (dependências e segredos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Issue #113 e checklist de produção §10: nenhuma vulnerabilidade alta ou crítica e nenhum segredo no código.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependências com vulnerabilidade alta ou crítica (pnpm audit)
        run: pnpm audit --audit-level=high
      # Varre os arquivos do commit com as regras padrão do gitleaks + `.gitleaks.toml` (exceções de teste).
      # O histórico antigo se varre uma vez à mão (`gitleaks git`, docs/seguranca.md); daqui em diante cada commit passa aqui.
      - name: Segredos no código (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  e2e:
    name: E2E (360 px e 1440 px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Firefox e WebKit só rodam os testes da arte de resultado (projetos `*-arte` do playwright.config.ts).
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit
      # Estes E2E usam a API simulada e rodam no próprio runner. Os E2E com a API real rodam contra o
      # preview no workflow e2e-preview.yml (issue #81, docs/infra-vercel.md §9).
      - name: Playwright
        run: pnpm e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
