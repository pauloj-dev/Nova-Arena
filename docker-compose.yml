# Serviços locais da API real (issue #66). Alternativa sem Docker: `pnpm --filter @nova/db db:local` (docs/banco.md).
#
#   docker compose up -d
#   DATABASE_URL=postgres://nova:nova@localhost:5432/nova
#   KV_REST_API_URL=http://localhost:8079   KV_REST_API_TOKEN=nova-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cria também o banco `nova_test`, usado pelos testes de integração (TEST_DATABASE_URL).
      - ./packages/db/scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova -d nova']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # A API fala com o Upstash pela API REST: este contêiner traduz REST → Redis local.
  redis-rest:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: nova-local
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '8079:80'
    depends_on:
      - redis

volumes:
  postgres-data:
